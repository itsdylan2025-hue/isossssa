name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/overlay app/src/main/res/drawable
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "OverlayApp"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF_2
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.overlay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.overlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_3
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="Screen Overlay"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Displays a user-chosen image overlay on screen" />
                  </service>
              </application>
          </manifest>
          EOF_4
          cat > app/src/main/java/com/example/overlay/OverlayService.kt <<'EOF_5'
          package com.example.overlay

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.ImageView

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var view: ImageView? = null
              private lateinit var lp: WindowManager.LayoutParams

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("overlay", "Overlay", NotificationManager.IMPORTANCE_LOW)
                  )
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, "overlay")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle("Overlay is running")
                      .setContentText("Tap to adjust")
                      .setContentIntent(pi)
                      .build()
                  startForeground(1, n)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (view == null) addOverlay()
                  applyPrefs()
                  return START_STICKY
              }

              private fun addOverlay() {
                  view = ImageView(this).apply {
                      setImageResource(R.drawable.overlay_image)
                      scaleType = ImageView.ScaleType.FIT_XY // lets width and height stretch independently
                  }
                  lp = WindowManager.LayoutParams(
                      100, 100,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or // touches pass through
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START }
                  wm.addView(view, lp)
              }

              private fun applyPrefs() {
                  val p = getSharedPreferences("overlay", Context.MODE_PRIVATE)
                  val dm = resources.displayMetrics
                  val w = (p.getInt("w", 160) * dm.density).toInt()
                  val h = (p.getInt("h", 50) * dm.density).toInt()
                  lp.width = w
                  lp.height = h
                  // X/Y sliders (0-100%) position the image's CENTER on the screen
                  lp.x = (p.getInt("x", 50) / 100f * dm.widthPixels - w / 2f).toInt()
                  lp.y = (p.getInt("y", 50) / 100f * dm.heightPixels - h / 2f).toInt()
                  view?.let { wm.updateViewLayout(it, lp) }
              }

              override fun onDestroy() {
                  view?.let { wm.removeView(it) }
                  view = null
                  super.onDestroy()
              }

              companion object { const val ACTION_STOP = "com.example.overlay.STOP" }
          }
          EOF_5
          cat > app/src/main/java/com/example/overlay/MainActivity.kt <<'EOF_6'
          package com.example.overlay

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {
              private val prefs by lazy { getSharedPreferences("overlay", Context.MODE_PRIVATE) }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }

                  val toggle = Button(this).apply { text = "Start overlay" }
                  val stop = Button(this).apply { text = "Stop overlay" }
                  root.addView(toggle)
                  root.addView(stop)

                  addSlider(root, "Position X (left - right)", "x", 50, 100)
                  addSlider(root, "Position Y (up - down)", "y", 50, 100)
                  addSlider(root, "Width", "w", 160, 1200)
                  addSlider(root, "Height", "h", 50, 1200)

                  toggle.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(
                              Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          )
                          Toast.makeText(this, "Allow 'Display over other apps', then press Start again", Toast.LENGTH_LONG).show()
                      } else {
                          prefs.edit().putBoolean("running", true).apply()
                          startForegroundService(Intent(this, OverlayService::class.java))
                      }
                  }
                  stop.setOnClickListener {
                      prefs.edit().putBoolean("running", false).apply()
                      startService(Intent(this, OverlayService::class.java).setAction(OverlayService.ACTION_STOP))
                  }

                  setContentView(ScrollView(this).apply { addView(root) })

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
              }

              private fun addSlider(root: LinearLayout, title: String, key: String, def: Int, max: Int) {
                  val value = prefs.getInt(key, def)
                  val label = TextView(this).apply { text = "$title: $value"; setPadding(0, 40, 0, 0) }
                  val bar = SeekBar(this).apply {
                      this.max = max
                      progress = value
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar, p: Int, fromUser: Boolean) {
                              val v = if (key == "w" || key == "h") p.coerceAtLeast(10) else p
                              label.text = "$title: $v"
                              prefs.edit().putInt(key, v).apply()
                              if (prefs.getBoolean("running", false)) {
                                  startService(Intent(this@MainActivity, OverlayService::class.java))
                              }
                          }
                          override fun onStartTrackingTouch(s: SeekBar) {}
                          override fun onStopTrackingTouch(s: SeekBar) {}
                      })
                  }
                  root.addView(label)
                  root.addView(bar)
              }
          }
          EOF_6
