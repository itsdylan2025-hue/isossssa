name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/overlay app/src/main/res/drawable
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "OverlayApp"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF_2
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.overlay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.overlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_3
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="Screen Overlay"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Displays a user-chosen image overlay on screen" />
                  </service>
              </application>
          </manifest>
          EOF_4
          cat > app/src/main/java/com/example/overlay/OverlayService.kt <<'EOF_5'
          package com.example.overlay

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Toast

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var view: View? = null
              private var lp: WindowManager.LayoutParams? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("overlay", "Overlay", NotificationManager.IMPORTANCE_LOW)
                  )
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, "overlay")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle("Overlay is running")
                      .setContentText("Tap to adjust")
                      .setContentIntent(pi)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  try {
                      if (view == null) addOverlay()
                      applyPrefs()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Overlay error: " + e.message, Toast.LENGTH_LONG).show()
                  }
                  return START_STICKY
              }

              private fun addOverlay() {
                  view = View(this)
                  lp = WindowManager.LayoutParams(
                      300, 100,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START }
                  wm.addView(view, lp)
              }

              private fun applyPrefs() {
                  val v = view ?: return
                  val l = lp ?: return
                  val p = getSharedPreferences("overlay", Context.MODE_PRIVATE)
                  val dm = resources.displayMetrics
                  val w = (p.getInt("w", 160) * dm.density).toInt()
                  val h = (p.getInt("h", 50) * dm.density).toInt()
                  l.width = w
                  l.height = h
                  // X/Y sliders (0-100.0%) position the image's CENTER on the screen
                  l.x = (p.getInt("x2", 500) / 1000f * dm.widthPixels - w / 2f).toInt()
                  l.y = (p.getInt("y2", 500) / 1000f * dm.heightPixels - h / 2f).toInt()
                  v.background = GradientDrawable().apply {
                      shape = GradientDrawable.RECTANGLE
                      cornerRadius = 10000f
                      setColor(Color.BLACK)
                      if (p.getBoolean("outline", false)) setStroke((3 * dm.density).toInt(), Color.RED)
                  }
                  wm.updateViewLayout(v, l)
              }

              override fun onDestroy() {
                  view?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  view = null
                  super.onDestroy()
              }

              companion object { const val ACTION_STOP = "com.example.overlay.STOP" }
          }
          EOF_5
          cat > app/src/main/java/com/example/overlay/MainActivity.kt <<'EOF_6'
          package com.example.overlay

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*

          class MainActivity : Activity() {
              private val prefs by lazy { getSharedPreferences("overlay", Context.MODE_PRIVATE) }
              private lateinit var status: TextView

              private fun refresh() {
                  if (prefs.getBoolean("running", false)) {
                      startService(Intent(this, OverlayService::class.java))
                  }
              }

              private fun updateStatus() {
                  val perm = if (Settings.canDrawOverlays(this)) "ON" else "OFF (tap Start to fix)"
                  val run = if (prefs.getBoolean("running", false)) "running" else "stopped"
                  status.text = "Overlay permission: $perm\nOverlay: $run"
              }

              override fun onResume() {
                  super.onResume()
                  updateStatus()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }

                  status = TextView(this)
                  root.addView(status)

                  val toggle = Button(this).apply { text = "Start overlay" }
                  val stop = Button(this).apply { text = "Stop overlay" }
                  root.addView(toggle)
                  root.addView(stop)

                  val outline = CheckBox(this).apply {
                      text = "Show red outline (to see where it is)"
                      isChecked = prefs.getBoolean("outline", false)
                      setOnCheckedChangeListener { _, c ->
                          prefs.edit().putBoolean("outline", c).apply()
                          refresh()
                      }
                  }
                  root.addView(outline)

                  addSlider(root, "Position X (left - right)", "x2", 500, 1000, 10f)
                  addSlider(root, "Position Y (up - down)", "y2", 500, 1000, 10f)
                  addSlider(root, "Width", "w", 160, 1500, 1f)
                  addSlider(root, "Height", "h", 50, 1500, 1f)

                  toggle.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(
                              Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          )
                          Toast.makeText(this, "Turn ON 'Allow display over other apps', then come back and press Start", Toast.LENGTH_LONG).show()
                      } else {
                          try {
                              prefs.edit().putBoolean("running", true).apply()
                              startForegroundService(Intent(this, OverlayService::class.java))
                              Toast.makeText(this, "Overlay started", Toast.LENGTH_SHORT).show()
                          } catch (e: Exception) {
                              Toast.makeText(this, "Could not start: " + e.message, Toast.LENGTH_LONG).show()
                          }
                          updateStatus()
                      }
                  }
                  stop.setOnClickListener {
                      prefs.edit().putBoolean("running", false).apply()
                      startService(Intent(this, OverlayService::class.java).setAction(OverlayService.ACTION_STOP))
                      updateStatus()
                  }

                  setContentView(ScrollView(this).apply { addView(root) })

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
              }

              private fun addSlider(root: LinearLayout, title: String, key: String, def: Int, max: Int, div: Float) {
                  val value = prefs.getInt(key, def)
                  val label = TextView(this).apply { text = "$title: ${value / div}"; setPadding(0, 40, 0, 0) }
                  val bar = SeekBar(this).apply {
                      this.max = max
                      progress = value
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar, p: Int, fromUser: Boolean) {
                              val v = if (key == "w" || key == "h") p.coerceAtLeast(10) else p
                              label.text = "$title: ${v / div}"
                              prefs.edit().putInt(key, v).apply()
                              refresh()
                          }
                          override fun onStartTrackingTouch(s: SeekBar) {}
                          override fun onStopTrackingTouch(s: SeekBar) {}
                      })
                  }
                  root.addView(label)
                  root.addView(bar)
              }
          }
          EOF_6
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
